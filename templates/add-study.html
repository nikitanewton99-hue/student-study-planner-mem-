<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Study Session</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #222;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>📚 Add Study Session</h1>

        <p>Plan your next study session.</p>

        <form method="POST">

            <label>Subject</label>
            <input type="text" name="subject" placeholder="Example: Python" required>

            <label>Topic</label>
            <input type="text" name="topic" placeholder="Example: Functions" required>

            <label>Date</label>
            <input type="date" name="date" required>

            <label>Time</label>
            <input type="time" name="time" required>

            <label>Duration (hours)</label>
            <input type="number" name="duration" min="0.5" step="0.5" placeholder="Example: 2" required>

            <label>Status</label>
            <select name="status">
                <option value="Planned">Planned</option>
                <option value="Completed">Completed</option>
            </select>

            <button type="submit">Add Study Session</button>

        </form>

        <a href="/planner" class="back">← Back to Planner</a>

    </div>

</div>

</body>
</html>
